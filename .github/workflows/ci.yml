name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Зависимости
        run: pip install -r requirements-dev.txt
      - name: Тесты
        run: pytest -q
      - name: Типы
        run: mypy --strict minirt main.py
      - name: Стиль
        run: ruff check . && ruff format --check .
      - name: Сцена three.rt
        run: python main.py scenes/three.rt --no-window --out three.png
